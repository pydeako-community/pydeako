name: Release

# Publishes to PyPI with Trusted Publishing (OIDC) when a GitHub release
# is published. The release tag must match the version in pyproject.toml,
# and the whole CI workflow must pass on that tag first.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match pyproject version $version"
            exit 1
          fi

  ci:
    name: CI
    needs: check-tag
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  # This job has to stay in this file: PyPI doesn't accept a reusable
  # workflow as the trusted publisher.
  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pydeako-community/
    permissions:
      id-token: write
    steps:
      # The distributions that CI built and tested from this tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check these are the files the build job made
        env:
          SUMS: ${{ needs.ci.outputs.dist-sha256 }}
        run: test -n "$SUMS" && test "$(cd dist && sha256sum * | base64 -w0)" = "$SUMS"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
