name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements_test.txt
      - run: ruff check pydeako tests
      - run: ruff format --check pydeako tests
      - run: pylint pydeako tests
      - run: mypy pydeako tests
      - run: coverage run -m pytest
      - run: coverage report

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements_release.txt
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the wheel ships no tests
        run: |
          if python -m zipfile -l dist/*.whl | grep -E '/test_[^/]*\.py'; then
            exit 1
          fi
