[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeako-community"
version = "0.6.1"
authors = [
  { name="Deako", email="software@deako.com" },
  { name="pydeako-community contributors" },
]
maintainers = [
  { name="iulianmac" },
]
description = "Connect and interact with deako devices over the network locally"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = [
    "zeroconf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/pydeako-community/pydeako"
"Source" = "https://github.com/pydeako-community/pydeako"
"Bug Tracker" = "https://github.com/pydeako-community/pydeako/issues"
"Changelog" = "https://github.com/pydeako-community/pydeako/releases"

[tool.setuptools.packages.find]
include = ["pydeako*"]

[tool.setuptools.package-data]
pydeako = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Test bodies are still type checked, but test functions need no annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
strict = true

[tool.coverage.run]
branch = true
source = ["pydeako"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle (PEP 257)
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "G",      # flake8-logging-format
    "I",      # isort
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "RUF",    # ruff
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ASYNC109",  # find_devices(timeout=...) is public API
    "UP042",     # StrEnum would change what str() returns for the enums
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use literal values and take mock arguments they don't read.
"**/test_*.py" = ["ARG", "PLR2004"]
